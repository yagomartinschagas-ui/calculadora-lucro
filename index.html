<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Precificação & Ficha de Produto</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    /* Header e Logo */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eef2f5;
      padding-bottom: 20px;
      margin-bottom: 25px;
    }

    .header-info h1 {
      font-size: 24px;
      color: #1e293b;
    }

    .header-info p {
      font-size: 14px;
      color: #64748b;
    }

    .logo-container {
      text-align: center;
    }

    .logo-preview {
      max-height: 70px;
      max-width: 180px;
      object-fit: contain;
      display: block;
      margin-bottom: 5px;
    }

    /* Formulário e Inputs */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #f8fafc;
      padding: 20px;
      border-radius: 8px;
      border: 1fr solid #e2e8f0;
    }

    .card h3 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #0f172a;
      border-left: 4px solid #2563eb;
      padding-left: 8px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 5px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #2563eb;
    }

    /* Preview do Produto */
    .product-preview-card {
      display: flex;
      gap: 20px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 20px;
      border-radius: 8px;
      margin-top: 25px;
      align-items: center;
    }

    .product-img-box {
      width: 130px;
      height: 130px;
      background: #e2e8f0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px dashed #94a3b8;
      flex-shrink: 0;
    }

    .product-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-details {
      flex-grow: 1;
    }

    .product-details h4 {
      font-size: 18px;
      color: #166534;
      margin-bottom: 8px;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .stat-box {
      background: #ffffff;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      text-align: center;
    }

    .stat-box span {
      display: block;
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
    }

    .stat-box strong {
      font-size: 16px;
      color: #0f172a;
    }

    .stat-box.highlight strong {
      color: #16a34a;
    }

    /* Botões */
    .actions {
      margin-top: 25px;
      display: flex;
      gap: 15px;
      justify-content: flex-end;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-success {
      background: #16a34a;
      color: #fff;
    }

    .btn-success:hover {
      background: #15803d;
    }

    /* Regras de Impressão (PDF) */
    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .container {
        box-shadow: none;
        padding: 10px;
      }
      .actions, .no-print {
        display: none !important;
      }
      .card {
        border: 1px solid #ccc;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Cabeçalho com Logo -->
    <div class="header">
      <div class="header-info">
        <h1>Análise de Precificação & Produto</h1>
        <p>Relatório de Viabilidade e Margem de Lucro</p>
      </div>
      <div class="logo-container">
        <img id="logoImg" class="logo-preview" src="https://via.placeholder.com/150x60?text=Sua+Logo" alt="Logo">
        <input type="file" id="logoInput" accept="image/*" class="no-print" style="font-size: 11px;">
      </div>
    </div>

    <!-- Inputs -->
    <div class="grid">
      <!-- Dados do Produto -->
      <div class="card">
        <h3>1. Dados do Produto</h3>
        
        <div class="form-group">
          <label for="productName">Nome do Produto</label>
          <input type="text" id="productName" placeholder="Ex: Camisa Polo Masculina" value="Camisa Polo Masculina" oninput="calcular()">
        </div>

        <div class="form-group no-print">
          <label for="productImageInput">Foto do Produto</label>
          <input type="file" id="productImageInput" accept="image/*">
        </div>

        <div class="form-group">
          <label for="costPrice">Custo do Produto (R$)</label>
          <input type="number" id="costPrice" value="25.00" step="0.01" oninput="calcular()">
        </div>

        <div class="form-group">
          <label for="shippingCost">Embalagem & Frete Fixo (R$)</label>
          <input type="number" id="shippingCost" value="4.00" step="0.01" oninput="calcular()">
        </div>
      </div>

      <!-- Venda e Taxas da Plataforma -->
      <div class="card">
        <h3>2. Plataforma & Venda</h3>
        
        <div class="form-group">
          <label for="salePrice">Preço de Venda Pretendido (R$)</label>
          <input type="number" id="salePrice" value="69.90" step="0.01" oninput="calcular()">
        </div>

        <div class="form-group">
          <label for="platformFee">Taxa da Plataforma (%) [Ex: Shopee / Mercado Livre]</label>
          <input type="number" id="platformFee" value="14" step="0.1" oninput="calcular()">
        </div>

        <div class="form-group">
          <label for="taxFee">Impostos / Outros (%)</label>
          <input type="number" id="taxFee" value="6" step="0.1" oninput="calcular()">
        </div>
      </div>
    </div>

    <!-- Card de Apresentação com a Imagem do Produto -->
    <div class="product-preview-card">
      <div class="product-img-box">
        <img id="productImg" src="https://via.placeholder.com/130?text=Foto+do+Produto" alt="Produto">
      </div>
      <div class="product-details">
        <h4 id="displayProductName">Camisa Polo Masculina</h4>
        
        <div class="results-grid">
          <div class="stat-box">
            <span>Preço Venda</span>
            <strong id="resSalePrice">R$ 69,90</strong>
          </div>

          <div class="stat-box">
            <span>Custo Total</span>
            <strong id="resTotalCost">R$ 29,00</strong>
          </div>

          <div class="stat-box">
            <span>Taxas Totais</span>
            <strong id="resFees">R$ 13,98</strong>
          </div>

          <div class="stat-box highlight">
            <span>Lucro Líquido</span>
            <strong id="resProfit">R$ 26,92</strong>
          </div>

          <div class="stat-box highlight">
            <span>Margem %</span>
            <strong id="resMargin">38.5%</strong>
          </div>

          <div class="stat-box">
            <span>Retorno (ROI)</span>
            <strong id="resROI">92.8%</strong>
          </div>
        </div>
      </div>
    </div>

    <!-- Botões de Ação -->
    <div class="actions no-print">
      <button class="btn btn-primary" onclick="calcular()">Recalcular</button>
      <button class="btn btn-success" onclick="window.print()">Exportar PDF / Imprimir</button>
    </div>
  </div>

  <script>
    // Carregar Logo
    document.getElementById('logoInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById('logoImg').src = evt.target.result;
        }
        reader.readAsDataURL(file);
      }
    });

    // Carregar Foto do Produto
    document.getElementById('productImageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById('productImg').src = evt.target.result;
        }
        reader.readAsDataURL(file);
      }
    });

    // Função de Cálculo
    function calcular() {
      const name = document.getElementById('productName').value || 'Produto Sem Nome';
      const cost = parseFloat(document.getElementById('costPrice').value) || 0;
      const shipping = parseFloat(document.getElementById('shippingCost').value) || 0;
      const sale = parseFloat(document.getElementById('salePrice').value) || 0;
      const platformPercent = parseFloat(document.getElementById('platformFee').value) || 0;
      const taxPercent = parseFloat(document.getElementById('taxFee').value) || 0;

      // Cálculos
      const totalCost = cost + shipping;
      const totalFeesPercent = platformPercent + taxPercent;
      const feesValue = sale * (totalFeesPercent / 100);
      const netProfit = sale - totalCost - feesValue;
      const margin = sale > 0 ? (netProfit / sale) * 100 : 0;
      const roi = totalCost > 0 ? (netProfit / totalCost) * 100 : 0;

      // Atualiza Tela
      document.getElementById('displayProductName').innerText = name;
      document.getElementById('resSalePrice').innerText = 'R$ ' + sale.toFixed(2).replace('.', ',');
      document.getElementById('resTotalCost').innerText = 'R$ ' + totalCost.toFixed(2).replace('.', ',');
      document.getElementById('resFees').innerText = 'R$ ' + feesValue.toFixed(2).replace('.', ',');
      document.getElementById('resProfit').innerText = 'R$ ' + netProfit.toFixed(2).replace('.', ',');
      document.getElementById('resMargin').innerText = margin.toFixed(1) + '%';
      document.getElementById('resROI').innerText = roi.toFixed(1) + '%';
    }

    // Inicializa
    calcular();
  </script>
</body>
</html>
