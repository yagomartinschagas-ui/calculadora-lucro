<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Custos e Margem</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        .result-box {
            margin-top: 24px;
            padding: 16px;
            background-color: #f1f5f9;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .result-item:last-child {
            margin-bottom: 0;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary-color);
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <h2>Calculadora de Precificação</h2>
        
        <div class="input-group">
            <label for="custo">Custo do Produto (R$)</label>
            <input type="number" id="custo" placeholder="0,00" oninput="calcular()">
        </div>

        <div class="input-group">
            <label for="despesas">Despesas Fixas / Operacionais (%)</label>
            <input type="number" id="despesas" placeholder="0" oninput="calcular()">
        </div>

        <div class="input-group">
            <label for="margem">Margem de Lucro Desejada (%)</label>
            <input type="number" id="margem" placeholder="0" oninput="calcular()">
        </div>

        <div class="result-box">
            <div class="result-item">
                <span>Preço de Venda Sugerido:</span>
                <span id="precoVenda">R$ 0,00</span>
            </div>
            <div class="result-item">
                <span>Lucro Estimado:</span>
                <span id="lucroEstimado">R$ 0,00</span>
            </div>
        </div>
    </div>

    <script>
        function calcular() {
            const custo = parseFloat(document.getElementById('custo').value) || 0;
            const despesas = parseFloat(document.getElementById('despesas').value) || 0;
            const margem = parseFloat(document.getElementById('margem').value) || 0;

            // Fórmula baseada no marjear por preço de venda
            const divisor = 1 - ((despesas + margem) / 100);
            
            let precoVenda = 0;
            if (divisor > 0) {
                precoVenda = custo / divisor;
            }

            const lucro = precoVenda * (margem / 100);

            document.getElementById('precoVenda').innerText = `R$ ${precoVenda.toFixed(2).replace('.', ',')}`;
            document.getElementById('lucroEstimado').innerText = `R$ ${lucro.toFixed(2).replace('.', ',')}`;
        }
    </script>

</body>
</html>
